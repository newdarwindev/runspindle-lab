name: Strix scaffold checks (Mac lane unavailable)
on:
  push:
    branches: [main, 'ci/*']
permissions:
  contents: read
concurrency:
  group: runspindle-lab-local
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ format('runspindle-strix-direct-{0}-{1}-verify', github.run_id, github.run_attempt) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: checkout-cache
        name: Restore pinned submodules
        run: python3 tools/restore_checkout_cache.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.checkout-cache.outputs.restored != 'true'
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify assigned lane and prerequisites
        env:
          EXPECTED_OS: Linux
          EXPECTED_ARCH: X64
          ACTUAL_OS: ${{ runner.os }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          test "$ACTUAL_OS" = "$EXPECTED_OS"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          command -v python3
          command -v git
          python3 --version
          git --version
      - name: Verify pins and scaffold contracts
        run: |
          python3 tools/lab.py check
          python3 -m unittest discover -s tests -v
      - name: Independent demo fixture contracts (not product acceptance)
        run: python3 tools/lab.py fixture-contracts
      - name: Generate truthful blocked-lane status
        if: always()
        run: python3 tools/lab.py report
      - name: Retain synthetic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-scaffold-strix-${{ github.sha }}
          path: artifacts/site/
          if-no-files-found: error
          retention-days: 30
